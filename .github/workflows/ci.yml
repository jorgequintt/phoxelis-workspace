name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # phoxelis is consumed locally via yalc, so install needs the local copy.
      - name: Install yalc
        run: npm i -g yalc

      - name: Add phoxelis (yalc)
        run: yalc add phoxelis

      - name: Install dependencies
        run: npm ci

      - name: Type-check + build
        run: npm run build

      - name: Run tests with coverage
        run: npm run test:coverage